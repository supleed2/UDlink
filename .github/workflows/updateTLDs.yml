name: Update TLDs
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
jobs:
  updateTLDs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Run Script
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const file = "src/index.ts";
            const old = fs.readFileSync(file).toString();
            const url = "https://api.unstoppabledomains.com/resolve/supported_tlds";
            const r = await fetch(url).then(r => r.json());
            const tlds = JSON.stringify(r["tlds"]);
            if (tlds) {
              const updated = old.replace(/const validTLDs = new Set\(\[.*?\]\);/gm, `const validTLDs = new Set(${tlds});`);
              fs.writeFileSync(file, updated);
            }
      - name: Commit Changes
        id: auto-commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit_message: Updated TLDs set
          file_pattern: src/index.ts
      - name: Deploy Cloudflare Worker
        if: steps.auto-commit.outputs.changes_detected == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy ./src/index.ts
